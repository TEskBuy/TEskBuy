<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produto — TEskBuy</title>
<meta name="description" content="Detalhes do produto na TEskBuy.">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/teskbuy.css?v=20260820d">
<style>
  .migalhas{ font-size:13px; color: var(--ink-dim); padding:22px 0 8px; }
  .migalhas a{ text-decoration:none; }
  .migalhas a:hover{ color: var(--orange-soft); }

  .produto-grelha{ display:grid; grid-template-columns: 1fr 1fr; gap:44px; padding:16px 0 40px; align-items:start; }
  .galeria-principal{
    aspect-ratio:1/1; border-radius: var(--raio-l); overflow:hidden;
    background: var(--surface-2); border:1px solid var(--linha);
  }
  .galeria-principal img{ width:100%; height:100%; object-fit:cover; }
  .miniaturas{ display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .miniaturas button{
    width:66px; height:66px; border-radius:var(--raio-s); overflow:hidden; padding:0;
    border:1px solid var(--linha); background: var(--surface-2); cursor:pointer;
  }
  .miniaturas button.activa{ border-color: var(--orange); }
  .miniaturas img{ width:100%; height:100%; object-fit:cover; }

  .preco-grande{ font-family:'IBM Plex Mono',monospace; font-size:32px; font-weight:600; color: var(--sand); }
  .quantidade{ display:inline-flex; align-items:center; border:1px solid var(--linha); border-radius:999px; overflow:hidden; }
  .quantidade button{
    width:40px; height:42px; background:transparent; border:none; color: var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .quantidade button svg{ width:15px; height:15px; }
  .quantidade button:hover{ background: rgba(238,247,248,0.07); }
  .quantidade span{ min-width:44px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:15px; }

  .especificacoes{ width:100%; border-collapse:collapse; min-width:0; }
  .especificacoes td{ padding:11px 0; border-bottom:1px solid rgba(238,247,248,0.08); font-size:14px; }
  .especificacoes td:first-child{ color: var(--ink-dim); width:42%; }

  .abas{ display:flex; gap:4px; border-bottom:1px solid var(--linha); margin-bottom:22px; flex-wrap:wrap; }
  .abas button{
    background:none; border:none; cursor:pointer; padding:12px 16px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;
    color: var(--ink-dim); border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .abas button.activa{ color: var(--ink); border-bottom-color: var(--orange); }

  .avaliacao-item{ padding:16px 0; border-bottom:1px solid rgba(238,247,248,0.07); }
  .estrelas{ display:inline-flex; gap:2px; color: var(--ambar); }
  .estrelas svg{ width:14px; height:14px; }
  .estrelas .vazia{ color: rgba(238,247,248,0.2); }

  @media (max-width: 860px){ .produto-grelha{ grid-template-columns:1fr; gap:26px; } }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="route-lines"></div>

<header id="cabecalho"></header>

<main class="env">
  <nav class="migalhas" id="migalhas"><a href="/">Início</a> · <a href="/loja">Loja</a></nav>
  <div id="conteudo"></div>
</main>

<footer id="rodape"></footer>

<script src="/assets/js/api.js?v=20260820d"></script>
<script src="/assets/js/estado.js?v=20260820d"></script>
<script src="/assets/js/ui.js?v=20260820d"></script>
<script src="/assets/js/pagina-produto.js?v=20260820d"></script>
</body>
</html>
