<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de gestão — TeskBuy</title>
<meta name="description" content="Painel de gestão da TeskBuy.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/teskbuy.css?v=20260818">
<style>
  .admin-grelha{ display:grid; grid-template-columns:214px 1fr; gap:26px; align-items:start; padding:24px 0 56px; }
  .admin-menu{ display:flex; flex-direction:column; gap:2px; position:sticky; top:calc(var(--cabecalho-altura) + 18px); }
  .admin-menu button{
    text-align:left; background:none; border:none; cursor:pointer; color:var(--ink-dim);
    font-family:inherit; font-size:14.5px; padding:11px 14px; border-radius:var(--raio-s);
    display:flex; align-items:center; gap:10px;
  }
  .admin-menu button:hover{ background:rgba(238,247,248,.06); color:var(--ink); }
  .admin-menu button.activo{ background:rgba(242,102,13,.14); color:var(--orange-soft); }
  .admin-menu button .n{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:.75; }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:22px; }
  .kpi{ background:var(--surface); border:1px solid var(--linha); border-radius:var(--raio); padding:16px 18px; }
  .kpi p:first-child{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-dim);
  }
  .kpi .v{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:23px; margin-top:8px; color:var(--sand); }
  .kpi.alerta .v{ color:var(--orange); }

  .barras{ display:flex; align-items:flex-end; gap:8px; height:120px; padding-top:8px; }
  .barras div{ flex:1; background:linear-gradient(180deg,var(--orange),rgba(242,102,13,.28)); border-radius:5px 5px 0 0; min-height:3px; }
  .barras-eixo{ display:flex; gap:8px; margin-top:8px; }
  .barras-eixo span{ flex:1; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-dim); }

  .barra-topo{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .barra-topo input, .barra-topo select{
    padding:10px 13px; background:rgba(238,247,248,.04); border:1px solid var(--linha);
    border-radius:var(--raio-s); color:var(--ink); font-family:inherit; font-size:14px;
  }
  .modal-fundo{
    position:fixed; inset:0; background:rgba(3,20,26,.72); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:80;
  }
  .modal{ background:var(--teal-deep); border:1px solid var(--linha-forte); border-radius:var(--raio);
    padding:24px; width:min(620px,100%); max-height:86vh; overflow:auto; }
  .admin-grelha > *{ min-width:0; }
  @media (max-width:860px){
    .admin-grelha{ grid-template-columns:1fr; gap:18px; }
    .admin-menu{
      position:static; flex-direction:row; flex-wrap:nowrap; gap:6px;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding-bottom:6px; scrollbar-width:none;
    }
    .admin-menu::-webkit-scrollbar{ display:none; }
    .admin-menu button{
      flex:0 0 auto; white-space:nowrap; padding:9px 14px;
      border:1px solid var(--linha); border-radius:999px;
    }
    .kpis{ grid-template-columns: repeat(2, 1fr); }
    .barra-topo input, .barra-topo select{ flex:1 1 100%; }
    .modal{ padding:18px; max-height:92vh; }
  }
</style>
</head>
<body>
<div class="bg-glow"></div><div class="route-lines"></div>
<header id="cabecalho"></header>
<main class="env"><div id="conteudo"></div></main>
<footer id="rodape"></footer>
<script src="/assets/js/api.js?v=20260818"></script>
<script src="/assets/js/estado.js?v=20260818"></script>
<script src="/assets/js/ui.js?v=20260818"></script>
<script src="/assets/js/pagina-admin.js?v=20260818"></script>
</body>
</html>
