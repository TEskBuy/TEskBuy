<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizar encomenda — TEskBuy</title>
<meta name="description" content="Finalize a sua encomenda na TEskBuy.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/teskbuy.css?v=20260820f">
<style>
  .checkout-grelha{ display:grid; grid-template-columns: 1fr 340px; gap:30px; align-items:start; padding:26px 0 50px; }
  .passo{ margin-bottom:26px; }
  .passo h2{ font-size:19px; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
  .passo h2 i{
    width:26px; height:26px; border-radius:50%; background:rgba(242,102,13,.16); color:var(--orange);
    display:inline-flex; align-items:center; justify-content:center; font-style:normal;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
  }
  .resumo{ position:sticky; top:calc(var(--cabecalho-altura) + 20px); }
  .resumo-linha{ display:flex; justify-content:space-between; padding:8px 0; font-size:14px; }
  .resumo-total{ border-top:1px solid var(--linha); margin-top:10px; padding-top:14px; font-size:18px; font-family:'Space Grotesk',sans-serif; font-weight:700; }
  .mini-item{ display:flex; gap:11px; padding:9px 0; font-size:13.5px; align-items:center; }
  .mini-item img{ width:42px; height:42px; border-radius:8px; object-fit:cover; background:var(--surface-2); }
  @media (max-width:820px){ .checkout-grelha{ grid-template-columns:1fr; } .resumo{ position:static; } }
</style>
</head>
<body>
<div class="bg-glow"></div><div class="route-lines"></div>
<header id="cabecalho"></header>
<main class="env">
  <h1 style="padding-top:28px">Finalizar encomenda</h1>
  <p class="silenciado pequeno" style="margin-top:6px">Confirmamos por telefone antes de enviar.</p>
  <div id="conteudo"></div>
</main>
<footer id="rodape"></footer>
<script src="/assets/js/api.js?v=20260820f"></script>
<script src="/assets/js/estado.js?v=20260820f"></script>
<script src="/assets/js/ui.js?v=20260820f"></script>
<script src="/assets/js/pagina-checkout.js?v=20260820f"></script>
</body>
</html>
