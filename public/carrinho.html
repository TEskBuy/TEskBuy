<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho — TeskBuy</title>
<meta name="description" content="O seu carrinho de compras na TeskBuy.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/teskbuy.css?v=20260819g">
<style>
  .carrinho-grelha{ display:grid; grid-template-columns: 1fr 340px; gap:30px; align-items:start; padding:30px 0 50px; }
  .item{ display:grid; grid-template-columns: 92px 1fr auto; gap:16px; padding:18px 0; border-bottom:1px solid var(--linha); align-items:center; }
  .item-img{ width:92px; height:92px; border-radius:var(--raio-s); overflow:hidden; background:var(--surface-2); }
  .item-img img{ width:100%; height:100%; object-fit:cover; }
  .item h3{ font-size:15.5px; margin-bottom:4px; }
  .item a{ text-decoration:none; }
  .quantidade{ display:inline-flex; align-items:center; border:1px solid var(--linha); border-radius:999px; }
  .quantidade button{ width:34px; height:36px; background:none; border:none; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .quantidade button svg{ width:13px; height:13px; }
  .quantidade span{ min-width:36px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:14px; }
  .resumo{ position:sticky; top:calc(var(--cabecalho-altura) + 20px); }
  .resumo-linha{ display:flex; justify-content:space-between; padding:9px 0; font-size:14.5px; }
  .resumo-total{ border-top:1px solid var(--linha); margin-top:10px; padding-top:14px; font-size:18px; font-family:'Space Grotesk',sans-serif; font-weight:700; }
  .barra-progresso{ height:5px; border-radius:999px; background:rgba(238,247,248,.1); overflow:hidden; margin:10px 0 6px; }
  .barra-progresso i{ display:block; height:100%; background:var(--orange); border-radius:999px; transition:width .4s; }
  @media (max-width:820px){ .carrinho-grelha{ grid-template-columns:1fr; } .resumo{ position:static; } .item{ grid-template-columns:72px 1fr; } .item-img{width:72px;height:72px} }
</style>
</head>
<body>
<div class="bg-glow"></div><div class="route-lines"></div>
<header id="cabecalho"></header>
<main class="env">
  <h1 style="padding-top:30px">Carrinho</h1>
  <div id="conteudo"></div>
</main>
<footer id="rodape"></footer>
<script src="/assets/js/api.js?v=20260819g"></script>
<script src="/assets/js/estado.js?v=20260819g"></script>
<script src="/assets/js/ui.js?v=20260819g"></script>
<script src="/assets/js/pagina-carrinho.js?v=20260819g"></script>
</body>
</html>
