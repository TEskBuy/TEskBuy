<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova palavra-passe — TEskBuy</title>
<meta name="description" content="Defina uma nova palavra-passe para a sua conta TEskBuy.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/teskbuy.css?v=20260820c">
<style>
  .autenticacao{ display:flex; align-items:center; justify-content:center; padding:48px 0 64px; }
  .caixa{ width:min(430px, 100%); }
  .caixa .cartao{ padding:30px; }
  .caixa h1{ font-size:27px; margin-bottom:6px; }
  .caixa .sub{ color:var(--ink-dim); font-size:14px; margin-bottom:24px; }
  .caixa .rodape-form{ text-align:center; margin-top:18px; font-size:14px; color:var(--ink-dim); }
  .caixa .rodape-form a{ color:var(--orange-soft); text-decoration:none; }
</style>
</head>
<body>
<div class="bg-glow"></div><div class="route-lines"></div>
<header id="cabecalho"></header>
<main class="env autenticacao">
  <div class="caixa">
    <div class="cartao">
      <h1>Nova palavra-passe</h1>
      <p class="sub">Escolha uma palavra-passe com pelo menos 8 caracteres.</p>
      <div id="aviso"></div>
      <form id="form">
        <div class="campo"><label for="palavra_passe">Nova palavra-passe</label>
          <input type="password" id="palavra_passe" name="palavra_passe" autocomplete="new-password" required minlength="8" placeholder="••••••••"></div>
        <div class="campo"><label for="confirmar">Repetir palavra-passe</label>
          <input type="password" id="confirmar" name="confirmar" autocomplete="new-password" required minlength="8" placeholder="••••••••"></div>
        <button class="btn btn-principal btn-largo" type="submit" id="submeter">Guardar palavra-passe</button>
      </form>
      <p class="rodape-form"><a href="/entrar">Voltar a entrar</a></p>
    </div>
  </div>
</main>
<footer id="rodape"></footer>
<script src="/assets/js/api.js?v=20260820c"></script>
<script src="/assets/js/estado.js?v=20260820c"></script>
<script src="/assets/js/ui.js?v=20260820c"></script>
<script src="/assets/js/pagina-autenticacao.js?v=20260820c"></script>
</body>
</html>
